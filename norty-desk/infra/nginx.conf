server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O aplicativo é uma página só: toda rota desconhecida cai no
    # index.html e o roteador do cliente resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Recurso com hash no nome pode ser guardado para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index nunca: é ele que aponta para os hashes novos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
