server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A API não publica porta no CT: o único caminho até ela é
    # este, pela rede interna do compose. Webhook de e-mail e da
    # Evolution entram por aqui, no mesmo domínio do aplicativo.
    location /api/ {
        proxy_pass http://desk-api:3061/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O /api é cortado aqui; a API precisa dele para montar o que o
        # navegador usa (URL da logo, path do cookie de sessão).
        proxy_set_header X-Forwarded-Prefix /api;

        # Anexo de e-mail e mídia de WhatsApp chegam em base64:
        # o corpo passa do padrão de 1 MB do nginx.
        client_max_body_size 32m;
        proxy_read_timeout   120s;
    }

    # O fluxo do chat ao vivo (SSE).
    #
    # **Antes do `/api/`**: o nginx escolhe o prefixo mais longo, então
    # esta regra ganha sem desativar o buffer do resto da API.
    #
    # `proxy_buffering off` é o ponto: com o buffer ligado — que é o
    # padrão — o nginx segura a resposta até encher, e um fluxo em
    # buffer não é um fluxo. A mensagem só chegaria em lotes, ou não
    # chegaria. A API já manda `X-Accel-Buffering: no`, e isto é o
    # cinto: quem trocar o cabeçalho na API não quebra a produção.
    #
    # O tempo de leitura acompanha a vida do fluxo (15 min no
    # controlador) com folga: cortado antes, o cliente reconectaria
    # sem parar.
    location /api/v1/chat/ {
        proxy_pass http://desk-api:3061/v1/chat/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        # `Connection` vazio: o padrão do nginx é "close", que fecharia
        # a conexão de longa duração a cada ida.
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 20m;
        proxy_send_timeout 20m;
    }

    # O aplicativo é uma página só: rota desconhecida cai no
    # index.html e o roteador do cliente resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Recurso com hash no nome pode ser guardado para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index nunca: é ele que aponta para os hashes novos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
