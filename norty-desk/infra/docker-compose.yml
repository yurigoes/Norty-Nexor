# =========================================================
#  NORTY DESK — VM NDesk
# ---------------------------------------------------------
#  Publicado em https://chamados.norty.com.br por túnel
#  Cloudflare. O `desk.norty.com.br` continua sendo o Desk
#  antigo do heimdall, que fica de retaguarda e não se toca.
#
#  Banco, Redis, MinIO e Evolution NÃO sobem aqui: são a infra
#  compartilhada do CT 102 Yggdrasil (192.168.15.72).
#
#  **Nenhuma porta é publicada para fora.** Quem alcança o mundo
#  é o `cloudflared`, que sai de dentro para a Cloudflare e volta
#  entregando em `desk-web` pela rede interna do compose. Não há
#  80 nem 443 abertos na VM, e nada em 0.0.0.0 — um servidor que
#  não escuta é um servidor que não se ataca pela porta.
#
#  A API não publica porta nem para o host: ela só é alcançável
#  pelo nginx do front. É o desenho do LICITA+, e é o que garante
#  que não exista caminho até a API que não passe pelo mesmo
#  domínio — e, portanto, pelo mesmo cookie de sessão.
#
#  Subir, na VM NDesk:
#    cd /opt/norty-desk && docker compose up -d --build
# =========================================================

name: norty-desk

services:
  desk-api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    container_name: desk-api
    restart: unless-stopped
    env_file: ../apps/api/.env
    environment:
      TZ: America/Bahia
    # Sem `ports`: quem alcança a API é o nginx do desk-web.
    expose:
      - "3061"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3061/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      # Sem limite, o json-file cresce até encher o disco do CT.
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [desk]

  # Filas de saída, coleta IMAP, cobrança de pendência e
  # escalonamento. Mesma imagem da API: dois processos, um
  # artefato — o worker não pode divergir da API que o gerou.
  desk-worker:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    container_name: desk-worker
    restart: unless-stopped
    env_file: ../apps/api/.env
    environment:
      TZ: America/Bahia
      MODO: worker
    depends_on:
      desk-api:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [desk]

  desk-web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    container_name: desk-web
    restart: unless-stopped
    depends_on:
      # Só `started`, não `healthy`: o front precisa subir mesmo
      # com a API fora do ar, para exibir o aviso em vez de a
      # página inteira ficar indisponível por causa do banco.
      desk-api:
        condition: service_started
    # Só no laço local, e só se `DESK_PORT` for definido: serve
    # para depurar de dentro da VM (`curl 127.0.0.1:3060`) sem
    # abrir nada para a rede. Quem publica é o túnel.
    ports:
      - "127.0.0.1:${DESK_PORT:-3060}:80"
    environment:
      TZ: America/Bahia
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [desk]

  # A porta de entrada. Sai de dentro para a Cloudflare e recebe
  # de volta o tráfego de chamados.norty.com.br — por isso a VM
  # não precisa de IP público, nem de 80/443 abertos, nem de
  # certificado para renovar.
  #
  # O token é o segredo do túnel: quem o tem publica no lugar
  # deste serviço. Vem de `infra/.env` (que o .gitignore recusa),
  # nunca daqui.
  desk-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: desk-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TZ: America/Bahia
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?defina TUNNEL_TOKEN em infra/.env}
    depends_on:
      desk-web:
        condition: service_started
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [desk]

networks:
  desk:
    driver: bridge
