# =========================================================
#  NORTY DESK — máquina NDesk
# ---------------------------------------------------------
#  Publicado em https://chamados.norty.com.br por túnel
#  Cloudflare. O `desk.norty.com.br` continua sendo o Desk
#  antigo do heimdall, que fica de retaguarda e não se toca.
#
#  Banco, Redis, MinIO e Evolution NÃO sobem aqui: são a infra
#  compartilhada do CT 102 Yggdrasil (192.168.15.72).
#
#  Dois jeitos de publicar, escolhidos no infra/.env:
#
#  1. Conector externo — o que está no ar desde 10/09/2026.
#     A rota de chamados.norty.com.br vive num túnel que já
#     existe no parque (`norty-thor-yugo-family`, conector no
#     CT 102) e aponta para http://<IP da NDesk>:3060. Aqui não
#     roda cloudflared nenhum: um segundo conector do mesmo
#     túnel passaria a receber pedidos dos outros sites dele,
#     que esta máquina não serve. Para o conector de outro CT
#     alcançar o front, DESK_BIND=0.0.0.0.
#
#  2. Conector próprio — túnel exclusivo do chamados, com
#     COMPOSE_PROFILES=tunnel e TUNNEL_TOKEN no infra/.env. O
#     túnel aponta para http://desk-web:80, pela rede interna do
#     compose, e o front volta a escutar só em 127.0.0.1.
#
#  Nos dois, a API não publica porta nem para o host: ela só é
#  alcançável pelo nginx do front. É o desenho do LICITA+, e é o
#  que garante que não exista caminho até a API que não passe
#  pelo mesmo domínio — e, portanto, pelo mesmo cookie de sessão.
#
#  Subir, na NDesk:
#    cd /opt/norty-desk && bash scripts/subir-ndesk.sh
# =========================================================

name: norty-desk

services:
  desk-api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    container_name: desk-api
    restart: unless-stopped
    env_file: ../apps/api/.env
    environment:
      TZ: America/Bahia
    # Sem `ports`: quem alcança a API é o nginx do desk-web.
    expose:
      - "3061"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3061/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      # Sem limite, o json-file cresce até encher o disco do CT.
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [desk]

  # Filas de saída, coleta IMAP, cobrança de pendência e
  # escalonamento. Mesma imagem da API: dois processos, um
  # artefato — o worker não pode divergir da API que o gerou.
  desk-worker:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    container_name: desk-worker
    restart: unless-stopped
    env_file: ../apps/api/.env
    environment:
      TZ: America/Bahia
      MODO: worker
    depends_on:
      desk-api:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [desk]

  desk-web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    container_name: desk-web
    restart: unless-stopped
    depends_on:
      # Só `started`, não `healthy`: o front precisa subir mesmo
      # com a API fora do ar, para exibir o aviso em vez de a
      # página inteira ficar indisponível por causa do banco.
      desk-api:
        condition: service_started
    # 127.0.0.1 por padrão: só serve para depurar de dentro da
    # máquina (`curl 127.0.0.1:3060`). No modo de conector externo
    # o infra/.env define DESK_BIND=0.0.0.0, porque é por esta
    # porta que o conector, em outro CT, chega ao front.
    ports:
      - "${DESK_BIND:-127.0.0.1}:${DESK_PORT:-3060}:80"
    environment:
      TZ: America/Bahia
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [desk]

  # A porta de entrada no modo de conector próprio. Sai de dentro
  # para a Cloudflare e recebe de volta o tráfego de
  # chamados.norty.com.br — sem IP público, sem 80/443 abertos,
  # sem certificado para renovar.
  #
  # Só sobe com COMPOSE_PROFILES=tunnel. No modo de conector
  # externo ele NÃO pode subir com o token do túnel compartilhado:
  # viraria réplica de um túnel cujos outros sites esta máquina não
  # serve, e a Cloudflare sortearia pedidos deles para cá.
  #
  # O token é o segredo do túnel: quem o tem publica no lugar
  # deste serviço. Vem de `infra/.env` (que o .gitignore recusa),
  # nunca daqui. `:-` e não `:?`: com `:?` o compose recusava
  # interpretar o arquivo inteiro sem o token — até um
  # `up desk-api` — mesmo com este serviço fora do profile.
  #
  # `--protocol http2`: em QUIC o canal de controle dos conectores
  # do thor cai em laço (`control stream encountered a failure`),
  # e um conector nesse estado segue servindo a configuração velha
  # sem receber as mudanças feitas no painel. Em TCP isso não ocorre.
  desk-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: desk-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TZ: America/Bahia
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      desk-web:
        condition: service_started
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [desk]

networks:
  desk:
    driver: bridge
