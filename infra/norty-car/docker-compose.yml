# =========================================================
#  Norty Car | Sistema de Controle de Carros — stack de produção
# ---------------------------------------------------------
#  Segue as convenções da infraestrutura Norty (ver infra/NORTY.md):
#  Postgres e Redis são os compartilhados do CT 102; a borda é o
#  Cloudflare Tunnel. O Caddy só sobe com o perfil `custom-domains`,
#  para servir domínios próprios das locadoras com TLS sob demanda.
#
#      car.norty.com.br          → web  (porta WEB_PORT)
#      api-car.norty.com.br      → api  (porta API_PORT)
#      *.car.norty.com.br        → web  (sites das locadoras)
# =========================================================

name: nortycar

services:
  api:
    build:
      context: ../..
      dockerfile: infra/norty-car/api.Dockerfile
    container_name: nortycar-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3334
      DATABASE_URL: postgresql://${POSTGRES_USER:-nortycar}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@${POSTGRES_HOST:-192.168.15.72}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-nortycar}?schema=public&connection_limit=15
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      SECRETS_KEY: ${SECRETS_KEY:?defina SECRETS_KEY}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-14}
      APP_URL: ${APP_URL:-https://car.norty.com.br}
      CORS_ORIGINS: ${APP_URL:-https://car.norty.com.br}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.norty.com.br}
      SITE_BASE_DOMAIN: ${SITE_BASE_DOMAIN:-car.norty.com.br}
      SITE_CNAME_TARGET: ${SITE_CNAME_TARGET:-sites.car.norty.com.br}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      MFA_REQUIRED_PLATFORM: "true"
      JOBS_ENABLED: "true"
      JOBS_INTERVAL_SECONDS: ${JOBS_INTERVAL_SECONDS:-900}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-15}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    volumes:
      # Fotos de vistoria, documentos e arquivos 3D. Entra no backup.
      - nortycar-storage:/data/storage
    ports:
      - "${API_PORT:-3071}:3334"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3334/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ../..
      dockerfile: infra/norty-car/web.Dockerfile
      args:
        VITE_API_URL: ${API_URL:-https://api-car.norty.com.br}/v1
        VITE_APP_HOSTS: ${APP_HOSTS:-car.norty.com.br}
    container_name: nortycar-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3070}:80"

  caddy:
    image: caddy:2.8-alpine
    container_name: nortycar-caddy
    profiles: ["custom-domains"]
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - nortycar-caddy-data:/data
    depends_on: [web, api]

volumes:
  nortycar-storage:
  nortycar-caddy-data:
