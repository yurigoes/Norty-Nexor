server {
    listen 80 default_server;
    # Qualquer host: o app decide se é o aplicativo ou o site de uma
    # locadora, e a API só devolve dados de site publicado e de domínio
    # verificado — o nginx não precisa conhecer cada domínio.
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome: cache longo. O index.html e o service
    # worker nunca: senão o navegador fica preso a uma versão antiga.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /sw.js { add_header Cache-Control "no-cache, must-revalidate"; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;
    gzip_min_length 1024;
}
