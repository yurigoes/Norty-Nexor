# =========================================================
#  my Home by norty — stack do CT 105 Asgard (fase3)
# ---------------------------------------------------------
#  Segue as convenções da infraestrutura Norty:
#
#  · Banco, Redis e MinIO NÃO sobem aqui. São a infra compartilhada
#    do CT 102 Yggdrasil (192.168.15.72). Cada app subir o próprio
#    Postgres significaria N backups, N versões e N lugares para
#    procurar quando um dado some.
#
#  · Não há Caddy nem portas 80/443. O Cloudflare Tunnel termina o
#    TLS e alcança estas portas internas direto — certificado,
#    renovação e exposição do roteador deixam de ser problema nosso.
#
#  · O código mora em /srv/apps-fase3/my-home no host thor e entra
#    no CT por bind-mount em /opt/fase3/my-home. Edite no host,
#    reconstrua aqui dentro.
#
#      myhome.norty.com.br      → 192.168.15.75:3060
#      api-myhome.norty.com.br  → 192.168.15.75:3061
# =========================================================

name: myhome

services:
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    container_name: myhome-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      # Infra compartilhada — CT 102 Yggdrasil.
      DATABASE_URL: postgresql://${POSTGRES_USER:-myhome}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@${POSTGRES_HOST:-192.168.15.72}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-myhome}?schema=public&connection_limit=10
      REDIS_URL: redis://${REDIS_HOST:-192.168.15.72}:${REDIS_PORT:-6379}/${REDIS_DB:-7}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      CORS_ORIGINS: ${APP_URL:-https://myhome.norty.com.br}
      # O ponto na frente faz o cookie do refresh valer para
      # myhome e api-myhome ao mesmo tempo.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.norty.com.br}
      # Um salto: o cloudflared. Confiar na cadeia inteira deixaria
      # qualquer cliente forjar o próprio IP e escapar do limitador.
      TRUST_PROXY_HOPS: 1
      APP_VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - "${API_PORT:-3061}:3333"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        # O Vite grava este valor dentro do bundle em tempo de build:
        # não há como trocá-lo depois sem reconstruir a imagem.
        VITE_API_URL: ${API_URL:-https://api-myhome.norty.com.br}/v1
        VITE_DATA_SOURCE: api
    container_name: myhome-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3060}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
