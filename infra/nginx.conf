server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O React Router resolve as rotas no cliente. Sem esta linha,
    # recarregar /app/reservas pediria um arquivo que não existe e
    # o nginx devolveria 404 numa rota perfeitamente válida.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets levam hash no nome, então podem ser cacheados para sempre;
    # o index.html não, senão o navegador serviria um HTML velho apontando
    # para bundles que já não existem.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
