# =========================================================
#  LICITA+ — servidor estático
# ---------------------------------------------------------
#  O roteamento é por hash (#/painel), então o navegador nunca
#  pede uma rota ao servidor: qualquer URL resolve no index.html
#  e o JavaScript decide o resto. Não há a armadilha de 404 em
#  rota válida que o roteamento por path traz.
# =========================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Módulos ES precisam do Content-Type correto: servido como
    # text/plain, o navegador recusa o import e a tela fica em
    # branco sem erro visível.
    types {
        text/html   html;
        text/css    css;
        text/javascript js mjs;
        image/svg+xml   svg;
        application/json json;
    }

    # Os arquivos não levam hash no nome, então cache longo
    # serviria versão velha depois de um deploy. Cache curto com
    # revalidação: o navegador pergunta, o nginx responde 304
    # quando nada mudou.
    location ~* \.(js|css|svg)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Nenhum host externo além do Google Fonts. Um script injetado
    # por terceiro não teria de onde carregar.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
