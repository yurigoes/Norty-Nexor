# =========================================================
#  LICITA+ — Thor / Proxmox
# ---------------------------------------------------------
#  Segue a convenção da infra Norty: o código mora no host em
#  /srv/apps-fase<N>/licita-mais e entra no CT por bind-mount em
#  /opt/fase<N>/licita-mais. Edita-se no host, reconstrói-se
#  dentro do container.
#
#  Publica só uma porta alta no CT, nunca 80 ou 443: quem termina
#  TLS e resolve o domínio é o ingress da Norty, não este
#  compose. Um serviço tomando a 443 aqui brigaria com tudo o que
#  já serve domínio no Thor.
#
#  Subir:
#    pct exec 105 -- bash -c \
#      'cd /opt/fase3/licita-mais && docker compose up -d --build'
# =========================================================

name: licita-mais

services:
  licita-web:
    build:
      context: .
      dockerfile: deploy.Dockerfile
    container_name: licita-web
    restart: unless-stopped
    ports:
      # Só no loopback do CT seria o ideal, mas o ingress vem de
      # outro host — então escuta em todas as interfaces do CT e
      # o firewall do Proxmox faz o recorte.
      - "${LICITA_PORT:-3060}:80"
    environment:
      TZ: America/Bahia
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s
    logging:
      # Sem limite, o json-file cresce até encher o disco do CT.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
