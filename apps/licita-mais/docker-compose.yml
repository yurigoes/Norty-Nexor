# =========================================================
#  LICITA+ — Thor / Proxmox
# ---------------------------------------------------------
#  Segue a convenção da infra Norty: o código mora no host em
#  /srv/apps-fase<N>/licita-mais e entra no CT por bind-mount em
#  /opt/licita-mais. Edita-se no host, reconstrói-se dentro do
#  container.
#
#  Dois serviços, uma pasta só. A API viaja dentro do diretório
#  do front, em `servidor/`, e o domínio compartilhado em
#  `compartilhado/`. O motivo é o CT 103: lá o bind-mount é por
#  app, e criar um mount novo exige reiniciar o container — o que
#  derrubaria Bolão, Central de Leads e Sorva junto. Uma pasta a
#  mais aqui evita uma janela de manutenção lá.
#
#  Publica só uma porta alta no CT, nunca 80 ou 443: quem termina
#  TLS e resolve o domínio é o ingress da Norty, não este
#  compose. A API **não publica porta nenhuma** — ela só é
#  alcançável pelo nginx, pela rede interna do compose. É o que
#  garante que não exista um caminho até a API que não passe pelo
#  mesmo domínio (e, portanto, pelo cookie de sessão).
#
#  Subir:
#    pct exec 103 -- bash -c \
#      'cd /opt/licita-mais && docker compose up -d --build'
# =========================================================

name: licita-mais

services:
  licita-web:
    build:
      context: .
      dockerfile: deploy.Dockerfile
    container_name: licita-web
    restart: unless-stopped
    depends_on:
      # Só `started`, não `healthy`: o front precisa subir mesmo
      # com a API fora do ar. Ele detecta a ausência dela e exibe
      # a faixa de demonstração, em vez de a página inteira ficar
      # indisponível por causa do banco.
      licita-api:
        condition: service_started
    ports:
      # Só no loopback do CT seria o ideal, mas o ingress vem de
      # outro host — então escuta em todas as interfaces do CT e
      # o firewall do Proxmox faz o recorte.
      - "${LICITA_PORT:-3500}:80"
    environment:
      TZ: America/Bahia
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s
    logging:
      # Sem limite, o json-file cresce até encher o disco do CT.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  licita-api:
    build:
      context: .
      dockerfile: servidor/deploy.Dockerfile
    container_name: licita-api
    restart: unless-stopped
    # Nenhuma porta publicada — ver o cabeçalho.
    expose:
      - "3501"
    environment:
      NODE_ENV: production
      TZ: America/Bahia
      PORT: 3501

      # Todo segredo vem do .env ao lado deste arquivo, que fica
      # no host e nunca no repositório. Sem valor padrão de
      # propósito: uma API que sobe com JWT_SECRET vazio é pior
      # do que uma que não sobe.
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env}
      JWT_SECRET: ${JWT_SECRET:?gere com openssl rand -base64 48 e ponha no .env}

      APP_URL: ${APP_URL:-https://licita.norty.com.br}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://licita.norty.com.br}
      # Vazio: o cookie fica preso ao host que o emitiu, que é o
      # comportamento mais restrito. Só vale preencher se algum dia
      # houver um segundo subdomínio precisando da mesma sessão.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}

      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}

      # Sem SMTP_HOST o envio não falha: registra no log e segue.
      # É o que permite subir antes do SMTP estar pronto — mas
      # ninguém consegue confirmar a conta até ele existir.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      # Sem valor padrão de propósito: ausente, a API deduz o modo
      # pela porta (465 = TLS implícito). Fixar `false` aqui
      # recriaria a combinação que trava o envio.
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-LICITA+ <nao-responda@norty.com.br>}

      PNCP_UFS: ${PNCP_UFS:-BA,SE,PE}
      PNCP_JANELA_DIAS: ${PNCP_JANELA_DIAS:-30}
      PNCP_INTERVALO_MS: ${PNCP_INTERVALO_MS:-900}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3501/v1/saude"]
      interval: 30s
      timeout: 5s
      retries: 3
      # A primeira subida roda a migração antes de servir.
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
