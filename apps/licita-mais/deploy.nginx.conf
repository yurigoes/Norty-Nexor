# =========================================================
#  LICITA+ — servidor estático
# ---------------------------------------------------------
#  O roteamento é por hash (#/painel), então o navegador nunca
#  pede uma rota ao servidor: qualquer URL resolve no index.html
#  e o JavaScript decide o resto. Não há a armadilha de 404 em
#  rota válida que o roteamento por path traz.
# =========================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # A API é servida sob o MESMO domínio, de propósito. O refresh
    # token vive num cookie `SameSite=Lax`, que o navegador não
    # envia numa requisição entre sites — com a API num subdomínio
    # separado, a sessão morreria a cada 15 minutos e o F5
    # derrubaria todo mundo. Servir sob /v1 resolve cookie e CORS
    # de uma vez, em vez de afrouxar o cookie para `None` só para
    # acomodar um host diferente.
    location /v1/ {
        proxy_pass http://licita-api:3501;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # O throttler da API limita por IP. Sem estes cabeçalhos
        # todos os pedidos chegariam com o IP do nginx, e o limite
        # de cinco cadastros por dez minutos valeria para o
        # conjunto de todos os visitantes.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Resposta de erro da API passa como está: ela já decide o
        # que pode ou não aparecer para o cliente em produção.
        proxy_intercept_errors off;

        # Ingestão e relatórios podem demorar mais que o padrão de
        # 60s do nginx sob carga.
        proxy_read_timeout 120s;
    }

    # Sem bloco `types` aqui, de propósito. No nginx um `types`
    # em qualquer nível SUBSTITUI o mapa herdado inteiro em vez
    # de complementá-lo — bastaria declarar um tipo para que
    # imagem e fonte passassem a sair como
    # application/octet-stream. A imagem serve só .html, .css e
    # .js, todos já corretos no mime.types padrão, e o
    # Content-Type de .js é o que faz os módulos ES carregarem.

    # Os arquivos não levam hash no nome, então cache longo
    # serviria versão velha depois de um deploy. Cache curto com
    # revalidação: o navegador pergunta, o nginx responde 304
    # quando nada mudou.
    location ~* \.(js|css|svg)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Nenhum host externo além do Google Fonts. Um script injetado
    # por terceiro não teria de onde carregar.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
